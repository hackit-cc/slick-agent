name: Deploy Site

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'skills/**'
      - 'optional-skills/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:
    inputs:
      skills_index_run_id:
        description: 'Optional Build Skills Index run ID whose skills-index artifact should be deployed'
        required: false
        type: string
      rebuild_skills_index:
        description: 'Force a fresh multi-source crawl instead of reusing the latest healthy index'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-vercel:
    # Triggered automatically on release publish (production cuts) and
    # manually via `gh workflow run deploy-site.yml` when an out-of-band
    # main commit needs to ship live before the next release tag — e.g.
    # a skills-index PR that doesn't touch website/** paths and so
    # doesn't auto-deploy via the deploy-docs path.
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Trigger Vercel Deploy
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        # An unset secret expands to an empty string, and `curl -X POST ""`
        # fails with "URL rejected: Malformed input to a URL function" (exit 3)
        # rather than doing nothing — which is how this job failed the whole
        # workflow on the v2026.9.13 release. This site deploys through Argo CD
        # from hackit-config, not Vercel, so no hook is configured and the
        # honest behaviour is to skip.
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK not set — skipping (this site deploys via Argo CD)"
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 10 -X POST "$HOOK"

  deploy-docs:
    # The repository is hackit-cc/slick-agent. This read 'Hackit/slick-agent',
    # which matches nothing, so this job reported "skipped" on every run since
    # the repo was created and the docs have never been built or published.
    if: github.repository == 'hackit-cc/slick-agent'
    runs-on: ubuntu-latest
    # 30 minutes is what CANCELLED the first run that ever got past the
    # repository-name typo above — it ran 30m20s and was killed by its own
    # timeout, which reads as a mysterious cancellation rather than a slow
    # build. Docusaurus builds this site twice (en + zh-Hans) on top of the
    # generated per-skill pages; a warm local build with node_modules already
    # present, and WITHOUT the skills-index and skill-docs steps below, takes
    # ~10 minutes. Cold on a standard runner with both of those in front of it,
    # 30 is not a safe ceiling. This is a ceiling, not a reservation: a fast run
    # still finishes fast.
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Get GitHub App token
        id: app-token
        uses: ./.github/actions/get-app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: grab npm 12
        run: |
          npm i -g npm@12

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'

      - name: Install PyYAML for skill extraction
        uses: ./.github/actions/retry
        with:
          command: pip install pyyaml==6.0.2 httpx==0.28.1

      - name: Prepare skills index (unified multi-source catalog)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          SKILLS_INDEX_RUN_ID: ${{ github.event.inputs.skills_index_run_id || '' }}
          REBUILD_SKILLS_INDEX: ${{ github.event.inputs.rebuild_skills_index || 'false' }}
        run: |
          # The unified external catalog is expensive to crawl and can burn
          # through the repository installation's GitHub API quota when several
          # docs deploys land close together.  Normal docs deploys therefore
          # reuse the latest healthy catalog: first the artifact from a
          # scheduled skills-index run, then the currently live index.  Only a
          # manual force rebuild does a fresh crawl here.
          #
          # If we do crawl, the build remains fatal. build_skills_index.py runs
          # the health check BEFORE writing and exits non-zero on source
          # collapse, keeping the last good Pages deployment live instead of
          # publishing a degenerate catalog.
          set -euo pipefail
          INDEX_PATH="website/static/api/skills-index.json"
          mkdir -p "$(dirname "$INDEX_PATH")"

          validate_index() {
            python3 - "$INDEX_PATH" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except Exception as exc:
              print(f"invalid skills index JSON: {exc}", file=sys.stderr)
              sys.exit(1)
          skills = data.get("skills")
          if not isinstance(skills, list) or len(skills) < 1500:
              count = len(skills) if isinstance(skills, list) else "missing"
              print(f"skills index too small: {count}", file=sys.stderr)
              sys.exit(1)
          print(f"skills index ready: {len(skills)} skills")
          PY
          }

          if [ "$REBUILD_SKILLS_INDEX" = "true" ]; then
            python3 scripts/build_skills_index.py
            validate_index
            exit 0
          fi

          if [ -n "$SKILLS_INDEX_RUN_ID" ]; then
            tmpdir="$(mktemp -d)"
            echo "Downloading skills-index artifact from run $SKILLS_INDEX_RUN_ID"
            if gh run download "$SKILLS_INDEX_RUN_ID" --name skills-index --dir "$tmpdir"; then
              candidate="$(find "$tmpdir" -name skills-index.json -type f | head -n 1 || true)"
              if [ -n "$candidate" ]; then
                cp "$candidate" "$INDEX_PATH"
                if validate_index; then
                  exit 0
                fi
              fi
            fi
            echo "::warning::Could not use skills-index artifact from run $SKILLS_INDEX_RUN_ID; trying live index"
          fi

          # A committed index in the tree wins over everything except an
          # explicit force-rebuild. This exists to break a deadlock that made
          # the docs unpublishable:
          #
          #   the live index is served FROM the docs site -> the docs site has
          #   never published -> the fetch below 404s -> the crawl runs -> the
          #   crawl outlives the job timeout -> the docs never publish
          #
          # Two runs died that way, one at the old 30m ceiling and one at 90m,
          # both killed inside the crawl before Docusaurus ever started. The
          # cycle cannot break itself, so a seeded index is committed and used
          # here. Once a deploy succeeds the live path below starts working and
          # this becomes a cold start / offline fallback rather than the norm.
          if [ -s "$INDEX_PATH" ] && validate_index; then
            echo "Using the committed skills index."
            exit 0
          fi

          echo "Downloading currently live skills index"
          # NOTE: curl -o truncates the destination before it knows the request
          # failed, so a 404 here destroys the committed index. Fetch to a temp
          # file and only move it into place once it validates.
          tmp_index="$(mktemp)"
          if curl -fsSL --retry 3 --retry-delay 5 \
            "https://slick-agent.hackit.cc/docs/api/skills-index.json" \
            -o "$tmp_index"; then
            mv "$tmp_index" "$INDEX_PATH"
            validate_index && exit 0
          fi
          rm -f "$tmp_index"

          # NO CRAWL HERE, deliberately. The crawl is what kept the docs
          # unpublishable: it never finished inside a job. Two runs were killed
          # in this step — one at a 30-minute ceiling, one at 90 — with
          # Docusaurus never starting and every later step skipped.
          #
          # A local run with no timeout at all got far enough to show where it
          # goes: every source crawls in reasonable time (skills.sh 20000 in
          # 2.5s, github 496 in 270s, clawhub 78046 in 788s, path resolution
          # 17834/20000 in 704s) and then it reaches
          # "Enriching 78046 ClawHub skills with owner handles" and stops
          # making progress. That step, not the docs, is the problem.
          #
          # So the index is now strictly optional. website/scripts/extract-skills.py
          # already handles its absence — extract_unified_index_skills() returns
          # (None, None) when the file is missing and the caller falls back to
          # the legacy skills/index-cache/ — and generate-skill-docs.py never
          # reads it at all. The docs build and publish either way; the Skills
          # Hub page simply shows the legacy catalog instead of the unified one.
          #
          # The real catalog is the scheduled skills-index.yml job's business.
          # When it produces a healthy artifact, pass it here with
          # `skills_index_run_id`, or force a crawl with `rebuild_skills_index`
          # if you are prepared to wait. Publishing the docs must not depend on
          # either finishing.
          echo "::warning::No usable skills index (committed, artifact, or live). Building the docs WITHOUT the unified catalog — the Skills Hub will fall back to the legacy index-cache. Re-run with rebuild_skills_index=true, or pass skills_index_run_id, to attach a real one."
          rm -f "$INDEX_PATH"

      - name: Extract skill metadata for dashboard
        run: python3 website/scripts/extract-skills.py

      - name: Regenerate per-skill docs pages + catalogs
        run: python3 website/scripts/generate-skill-docs.py

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: npm ci
          working-directory: website

      - name: Build Docusaurus
        run: npm run build
        working-directory: website

      - name: Stage deployment
        run: |
          mkdir -p _site/docs
          cp -r website/build/* _site/docs/
          # llms.txt / llms-full.txt are also published at the site root
          # (https://slick-agent.hackit.cc/llms.txt) because some
          # agents and IDE plugins probe the classic root-level path rather
          # than /docs/llms.txt. Same file, two URLs, one source of truth.
          if [ -f website/build/llms.txt ]; then
            cp website/build/llms.txt _site/llms.txt
          fi
          if [ -f website/build/llms-full.txt ]; then
            cp website/build/llms-full.txt _site/llms-full.txt
          fi

      # Pages serves exactly the newest artifact, so each deploy used to delete
      # the previous build's content-hashed JS/CSS while edge caches (Vercel →
      # Fastly, max-age=300 + stale-while-revalidate=3600) kept serving HTML
      # that referenced it — every asset request 404'd for up to ~65 minutes
      # after each deploy. With push-triggered deploys landing every ~15-30
      # minutes, the docs were in that broken window most of the day (search,
      # being pure client JS, died first). Fix: keep a rolling pool of prior
      # builds' hashed assets and union-merge it into every artifact so stale
      # HTML keeps resolving. Hashed filenames are content-addressed, so a
      # collision is by definition the identical file — the merge never
      # overwrites current-build output (cp --update=none).
      - name: Restore asset retention pool
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: _asset_retention
          key: docs-asset-retention-${{ github.run_id }}
          restore-keys: |
            docs-asset-retention-

      - name: Merge retained assets from previous deploys
        run: |
          set -euo pipefail
          ASSET_DIRS="assets zh-Hans/assets"
          mkdir -p _asset_retention
          # 1) Add this build's hashed assets to the pool (fresh mtimes, so
          #    assets still shipped by current builds never age out).
          for d in $ASSET_DIRS; do
            if [ -d "_site/docs/$d" ]; then
              mkdir -p "_asset_retention/$d"
              cp -a "_site/docs/$d/." "_asset_retention/$d/"
            fi
          done
          # 2) Drop pool entries no build has produced for 14 days — far
          #    beyond any edge-cache or open-tab horizon.
          find _asset_retention -type f -mtime +14 -delete
          find _asset_retention -type d -empty -delete
          # 3) Union-merge the pool into the artifact; --update=none keeps the
          #    current build authoritative for any path it produced.
          for d in $ASSET_DIRS; do
            if [ -d "_asset_retention/$d" ]; then
              mkdir -p "_site/docs/$d"
              cp -R --update=none "_asset_retention/$d/." "_site/docs/$d/"
            fi
          done
          echo "retention pool:" && du -sh _asset_retention
          echo "deployed assets:" && du -sh _site/docs/assets

      - name: Save asset retention pool
        # Always save under a fresh key (caches are immutable); restore-keys
        # prefix matching picks the newest on the next run.
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: _asset_retention
          key: docs-asset-retention-${{ github.run_id }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
