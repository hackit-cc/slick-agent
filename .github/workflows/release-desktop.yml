# .github/workflows/release-desktop.yml
name: Release Desktop

# Packages the Electron desktop app into real installers. Nothing else in CI
# does this: ci.yaml and its sub-workflows verify the tree, and e2e-desktop.yml
# builds the renderer + electron bundle only to drive Playwright — neither ever
# runs electron-builder. Before this file the only installers that existed were
# ones somebody produced by hand on their own machine.
#
# That distinction matters beyond convenience. apps/desktop/scripts/write-build-stamp.mjs
# prefers $GITHUB_SHA / $GITHUB_REF_NAME and stamps source:"ci"; off a laptop it
# falls back to `git rev-parse` and stamps source:"local". The stamp ships inside
# the app (extraResources) and is what first-launch bootstrap pins to when it
# fetches scripts/install.ps1 from raw.githubusercontent.com. A "local" stamp is
# therefore a build pinned to a ref nobody else can reproduce.
#
# NOTE ON RUNNERS: every job here uses a standard runner on purpose. The larger
# labels this repo uses elsewhere (ubuntu-latest-32-core, ubuntu-latest-96-core,
# windows-latest-32-core) are not being provisioned for this org — jobs asking
# for them sit in `queued` indefinitely. Packaging time is dominated by
# electron-builder's compression, which is not core-bound enough to be worth
# taking that risk.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Which installers to build.
        type: choice
        default: all
        options: [all, windows, macos, linux]
      publish:
        description: >-
          Attach the installers to the GitHub Release for this tag. Only
          meaningful when run on a tag; ignored otherwise.
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

# Deliberately NOT the ci-${{ github.ref }} group used by ci.yaml. That group
# runs with cancel-in-progress:false on push, so one run holding a job that
# cannot get a runner leaves every later run on the same ref stuck `pending`
# with zero jobs. Packaging keeps its own group so it can never be parked
# behind the verification lane.
concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Expand the platform choice into a matrix. A dispatch picks one or all;
  # a tag push always builds everything.
  # ──────────────────────────────────────────────────────────────────────
  matrix:
    name: Resolve target matrix
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      targets: ${{ steps.pick.outputs.targets }}
    steps:
      - id: pick
        env:
          CHOICE: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'all' }}
        run: |
          win='{"platform":"windows","runner":"windows-latest","script":"dist:win"}'
          mac='{"platform":"macos","runner":"macos-latest","script":"dist:mac"}'
          lin='{"platform":"linux","runner":"ubuntu-latest","script":"dist:linux"}'
          case "$CHOICE" in
            windows) targets="[$win]" ;;
            macos)   targets="[$mac]" ;;
            linux)   targets="[$lin]" ;;
            *)       targets="[$win,$mac,$lin]" ;;
          esac
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "Building: $targets"

  build:
    name: Package ${{ matrix.platform }}
    needs: matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      - name: grab npm 12
        shell: bash
        run: npm --version | grep -q '^12\.' || npm i -g npm@12

      # electron-builder shells out to `rpm` for the .rpm leg of dist:linux. It
      # is not on the ubuntu image by default, and its absence fails the build
      # only at the very end, after the AppImage and .deb have already built.
      - name: Install rpm tooling
        if: matrix.platform == 'linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm

      # Same cache shape as js-tests.yml: the installed tree, keyed on the
      # lockfile, with no restore-keys because a partial hit leaves a stale
      # tree. Scripts run, so electron's postinstall binary is inside the
      # cached tree.
      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            ui-tui/node_modules
            ui-tui/packages/*/node_modules
            tests-js/node_modules
            web/node_modules
          key: node-modules-scripts-${{ runner.os }}-node26-npm12-${{ hashFiles('package-lock.json') }}

      - uses: ./.github/actions/retry
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        with:
          command: npm ci

      # `--publish never` keeps electron-builder from deciding on its own to
      # push a release when it notices CI plus a tag. Publishing is an explicit,
      # separate job below.
      #
      # SIGNING is opt-in by presence of secrets, the same way notarize.mjs
      # already treats the Apple credentials: with no cert configured the build
      # produces exactly what it produces today (unsigned, rcedit-branded), and
      # the moment a cert secret is added the same job starts signing. Nothing
      # here needs editing when that day comes.
      #
      # Windows is the subtle one. build.win.signAndEditExecutable is false in
      # package.json and is load-bearing for LOCAL builds: turning it on
      # re-enables electron-builder's signtool step, which unpacks
      # winCodeSign-2.6.0.7z, whose macOS symlinks crash 7-Zip on non-admin
      # Windows without Developer Mode (see set-exe-identity.mjs). Hosted
      # windows-latest runners have SeCreateSymbolicLinkPrivilege, so CI can
      # take the path a laptop cannot — but only when there is a cert worth
      # taking it for. The override is passed on the CLI so the committed
      # default, and therefore every local build, is untouched.
      - name: Build installers
        id: build
        working-directory: apps/desktop
        shell: bash
        env:
          CSC_LINK: ${{ matrix.platform == 'windows' && secrets.WINDOWS_CSC_LINK || matrix.platform == 'macos' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'windows' && secrets.WINDOWS_CSC_KEY_PASSWORD || matrix.platform == 'macos' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          # Read by scripts/notarize.mjs (afterSign). Absent -> it logs and skips.
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          args=""
          if [ -n "$CSC_LINK" ]; then
            echo "signing: certificate present for ${{ matrix.platform }}"
            # A plain boolean, never the secret itself, so later steps can
            # branch on it without the value passing through an output.
            echo "signed=true" >> "$GITHUB_OUTPUT"
            if [ "${{ matrix.platform }}" = "windows" ]; then
              # Hand the exe edit AND the signature to electron-builder, in that
              # order. after-pack.mjs reads this flag and skips its own rcedit
              # pass, which would otherwise invalidate the fresh signature.
              args="--config.win.signAndEditExecutable=true"
              export SLICK_WIN_EB_EDITS_EXE=1
            fi
          else
            echo "signing: no certificate for ${{ matrix.platform }} — building unsigned"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            # Without this electron-builder scans the macOS keychain, finds
            # nothing, and fails the build instead of continuing unsigned.
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm run ${{ matrix.script }} -- --publish never $args

      # Proves the signature is really on the artifact. Only meaningful once a
      # cert exists; silent no-op before then. Without this an expired or
      # misconfigured cert shows up as a green build shipping unsigned files.
      - name: Verify Windows signature
        if: matrix.platform == 'windows' && steps.build.outputs.signed == 'true'
        shell: pwsh
        run: |
          $exe = Get-ChildItem apps/desktop/release/*.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $exe.FullName
          "$($exe.Name): $($sig.Status) — $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            Write-Output "::error::Authenticode status is $($sig.Status), expected Valid"
            exit 1
          }

      # The whole point of packaging in CI. write-build-stamp.mjs falls back to
      # a "local" (or all-zero "fallback") stamp when it cannot see CI env, and
      # that fallback is silent — it still yields a working installer, just one
      # pinned to a ref that is not reproducible. Assert rather than trust.
      - name: Verify CI build stamp
        working-directory: apps/desktop
        shell: bash
        run: |
          cat build/install-stamp.json
          node scripts/verify-ci-stamp.mjs

      - name: Collect installers
        working-directory: apps/desktop/release
        shell: bash
        run: |
          # win-unpacked/ and builder-debug.yml are build scratch, not artifacts.
          ls -la
          echo "--- collected ---"
          find . -maxdepth 1 -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.zip' \
               -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
               -o -name '*.blockmap' -o -name 'latest*.yml' \) -print

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slick-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml

  # ──────────────────────────────────────────────────────────────────────
  # Attach to the GitHub Release. Uses the preinstalled gh CLI rather than a
  # third-party release action, so nothing new has to be pinned and audited.
  # ──────────────────────────────────────────────────────────────────────
  publish:
    name: Attach to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "$TAG" --generate-notes --draft
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
