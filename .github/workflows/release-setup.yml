# .github/workflows/release-setup.yml
name: Release Setup Installer

# Packages apps/bootstrap-installer (the Tauri "Slick Setup" bootstrapper) into
# real Windows installers. Nothing else in CI does this: rust-tests.yml compiles
# and tests the crate but never runs `tauri build`, and release-desktop.yml
# packages the *Electron* app, which is a different program.
#
# Before this file, Slick-Setup.exe did not exist as a published artifact at
# all, even though scripts/install.ps1 refers to it by name in several places
# and src-tauri/tauri.conf.json omitted `nsis`/`msi` from bundle.targets, so
# even a local `tauri build` produced nothing installable on Windows. Both
# halves are fixed: the targets are in the config, and this workflow builds and
# attaches them.
#
# RELATIONSHIP TO install.ps1. Slick-Setup.exe is a *bootstrapper*: it does not
# contain Slick. At run time src-tauri/src/install_script.rs downloads
# scripts/install.ps1 from
#   https://raw.githubusercontent.com/hackit-cc/slick-agent/<ref>/scripts/install.ps1
# at a commit or branch pin and drives it stage by stage. That raw URL — not the
# copy served from slick-agent.hackit.cc — is the canonical script, which is why
# sync-install-scripts.yml pushes the repo copy out to the website rather than
# the other way round.
#
# NOTE ON RUNNERS: standard runners on purpose, matching release-desktop.yml.
# The larger labels used elsewhere in this repo are not being provisioned for
# this org and jobs requesting them sit in `queued` indefinitely.
#
# NOTE ON SIGNING: these installers are unsigned. Authenticode signing for Tauri
# is configured through bundle.windows.certificateThumbprint (plus the cert in
# the runner's certificate store), which is a different mechanism from the
# CSC_LINK/CSC_KEY_PASSWORD pair release-desktop.yml hands to electron-builder.
# Wiring it is deliberately left out rather than half-implemented; the verify
# step below reports the signature status it actually finds so the gap stays
# visible instead of silent.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Attach the installers to the GitHub Release for this tag. Only
          meaningful when run on a tag; ignored otherwise.
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

# Its own group, for the same reason release-desktop.yml keeps one: packaging
# must never be parked behind the verification lane's concurrency group.
concurrency:
  group: release-setup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package Slick Setup (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      - name: grab npm 12
        shell: bash
        run: npm --version | grep -q '^12\.' || npm i -g npm@12

      # rustup ships preinstalled on the hosted windows-latest image, so the
      # toolchain needs no third-party action — nothing new to pin and audit.
      # The MSVC host triple is what tauri targets on Windows; the image already
      # carries the Visual Studio build tools it links against.
      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      # src-tauri/.gitignore excludes Cargo.lock (see rust-tests.yml), so the
      # cache is keyed on Cargo.toml. Without restore-keys: a partial hit would
      # mix a stale target/ with a freshly resolved dependency graph.
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/bootstrap-installer/src-tauri/target
          key: cargo-setup-${{ runner.os }}-${{ hashFiles('apps/bootstrap-installer/src-tauri/Cargo.toml') }}

      # Same cache shape as release-desktop.yml: the installed tree, keyed on
      # the lockfile, no restore-keys. @tauri-apps/cli hoists to the root
      # node_modules through npm workspaces, so this is what provides `tauri`.
      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            ui-tui/node_modules
            ui-tui/packages/*/node_modules
            tests-js/node_modules
            web/node_modules
          key: node-modules-scripts-${{ runner.os }}-node26-npm12-${{ hashFiles('package-lock.json') }}

      - uses: ./.github/actions/retry
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        with:
          command: npm ci

      # tauri.conf.json carries a placeholder version (0.0.1). On a tag build
      # that would ship installers whose filename and Add/Remove Programs entry
      # disagree with the release they are attached to, so the tag wins. MSI
      # requires a strict major.minor.patch, which is why a tag like v1.2.3-rc1
      # is normalized rather than passed through.
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            raw="${GITHUB_REF#refs/tags/v}"
            version="$(printf '%s' "$raw" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' || true)"
            if [ -z "$version" ]; then
              echo "::error::Tag '$raw' has no major.minor.patch prefix; MSI cannot be versioned from it."
              exit 1
            fi

            # MSI's ProductVersion is major.minor.build with major and minor
            # capped at 255 and build at 65535 — WiX rejects anything larger
            # outright. This repo tags CalVer (v2026.9.13), so the tag's major
            # is a YEAR and every release would fail the msi leg while nsis
            # succeeded. Fold a 4-digit year to its last two digits: 2026.9.14
            # becomes 26.9.14, which stays ordered, stays unique per day, and
            # is what Add/Remove Programs shows. The GitHub Release and the
            # artifact filenames keep the real tag; only the embedded MSI
            # ProductVersion is folded.
            major="${version%%.*}"
            if [ "$major" -gt 255 ]; then
              folded="$(( major % 100 )).${version#*.}"
              echo "::notice::MSI caps ProductVersion major at 255; folding ${version} to ${folded} for the installer."
              version="$folded"
            fi
          else
            version="$(node -p "require('./apps/bootstrap-installer/src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "building version $version"

      # Explicit --bundles rather than relying on bundle.targets: the config
      # also lists app/dmg/appimage for the other platforms, and naming the
      # Windows bundles here means a config edit can never silently turn this
      # job into a no-op that still exits 0.
      - name: Build installers
        working-directory: apps/bootstrap-installer
        shell: bash
        run: |
          npx tauri build --bundles nsis,msi \
            --config "{\"version\":\"${{ steps.version.outputs.version }}\"}"

      # Tauri names its output from productName ("Slick"), which collides
      # conceptually with the Electron app's own installers in the same
      # release. Rename to the Slick-Setup-* name scripts/install.ps1 and the
      # docs already use, so the artifact people are told to download is the
      # artifact that exists.
      - name: Collect and rename installers
        id: collect
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bundle=apps/bootstrap-installer/src-tauri/target/release/bundle
          out=setup-dist
          mkdir -p "$out"
          shopt -s nullglob
          found=0
          for f in "$bundle"/nsis/*.exe; do
            cp "$f" "$out/Slick-Setup-${VERSION}-x64.exe"; found=$((found+1))
          done
          for f in "$bundle"/msi/*.msi; do
            cp "$f" "$out/Slick-Setup-${VERSION}-x64.msi"; found=$((found+1))
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::tauri build produced no nsis/msi bundles under $bundle"
            find "$bundle" -maxdepth 2 -type f -print || true
            exit 1
          fi
          ls -la "$out"

      # Reports rather than enforces: these builds are unsigned today (see the
      # header). When a certificate is wired up this step starts printing Valid
      # and an expired or misconfigured cert becomes visible here instead of
      # shipping quietly.
      - name: Report signature status
        shell: pwsh
        run: |
          Get-ChildItem setup-dist/* -Include *.exe,*.msi | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            "$($_.Name): $($sig.Status)"
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slick-setup-windows
          if-no-files-found: error
          retention-days: 14
          path: setup-dist/*

  # Attaches to the same GitHub Release release-desktop.yml uploads into, using
  # the preinstalled gh CLI so nothing new has to be pinned and audited.
  publish:
    name: Attach to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "$TAG" --generate-notes --draft
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
